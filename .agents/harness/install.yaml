# version pin and install settings (R25) — read by reins update
schema: reins/install@1
tier: graph
version: 0.1.2
cli: 0.2.0-rc.1
mode: manual
language: ko
release:
  workflows:
    - file: publish.yml
      inputs:
        version: "{version}"
        dry_run: "false"
      approval: npm-staged
  docs:
    - file: docs/ROADMAP.md
      check: roadmap-row
    - file: docs/ROADMAP.ko.md
      check: roadmap-row
    - file: CHANGELOG.md
      check: changelog-section
    - file: README.md
      check: mentions-version
    - file: docs/README.ko.md
      check: mentions-version
