name: Bug report
description: reins did something wrong, or stopped where it should not have
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The command you ran and its output, pasted as is (no summary).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: reins version
      description: "`npx @bluenyang/reins --version`"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Node version, agent (Claude Code / Codex / Antigravity / Cursor)"
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: "`reins status` output, the reason id (A1–G2, C1–C10) if a check stopped, related files."
