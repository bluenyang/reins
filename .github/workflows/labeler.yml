name: labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # creates labels that do not exist yet
    steps:
      # reads only .github/labeler.yaml from the base branch; the PR's code is never checked out
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yaml
          sync-labels: true
