# Publish @bluenyang/reins to npm (trusted publishing — no token; npm trusts this file by name).
#
# Trigger: Actions → "publish" → Run workflow
#   - release_type: patch | minor | major | rc  (rc: X.Y.Z-rc.N+1, or next patch -rc.1)
#   - version: exact version without a leading v (overrides release_type)
#   - dry_run: run every check and `npm publish --dry-run`; no commit, tag or upload
#
# Order: install → build → resolve version → set version (npm version; its `version` script rebuilds and syncs
# .claude-plugin/plugin.json and the SKILL.md pin) → reins update → gate (check, drift, CLI version, pins)
# → npm stage publish → commit version files and updated installs, tag, push.
# Staged publishing: the version waits in npm's staging area until the maintainer approves it with 2FA
# (npmjs.com → Staged Packages, or `npm stage approve <stage-id>`). Nothing is live before that.
# reins is released on npm only: no GitHub Release, no draft. Update CHANGELOG.md before running.

name: publish

run-name: publish ${{ inputs.version }} (dry_run=${{ inputs.dry_run }})

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version bump (ignored when `version` is set)
        required: true
        type: choice
        options: [patch, minor, major, rc]
        default: patch
      version:
        description: Exact version without leading v (e.g. 0.1.1). Empty = bump from package.json
        required: false
        type: string
        default: ''
      dry_run:
        description: Check and pack only — nothing is published or pushed
        required: true
        type: boolean
        default: false

permissions:
  contents: write # version commit and tag
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4 # version from package.json#packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # staged publishing needs npm 11.15.0 or later (trusted publishing 11.5.1)
      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Resolve version
        id: version
        shell: bash
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(node -p "require('./package.json').version")
          CORE=${CURRENT%%-*}
          IFS=. read -r MAJ MIN PAT <<< "$CORE"
          if [[ -n "$INPUT_VERSION" ]]; then
            NEXT=${INPUT_VERSION#v}
          else
            case "$RELEASE_TYPE" in
              major) NEXT="$((MAJ + 1)).0.0" ;;
              minor) NEXT="$MAJ.$((MIN + 1)).0" ;;
              patch) NEXT="$MAJ.$MIN.$((PAT + 1))" ;;
              rc)
                if [[ "$CURRENT" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
                  NEXT="${BASH_REMATCH[1]}-rc.$((BASH_REMATCH[2] + 1))"
                else
                  NEXT="$MAJ.$MIN.$((PAT + 1))-rc.1"
                fi ;;
            esac
          fi
          if [[ ! "$NEXT" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::not a version: $NEXT"; exit 1
          fi
          if npm view "@bluenyang/reins@$NEXT" version 2>/dev/null | grep -q .; then
            echo "::error::@bluenyang/reins@$NEXT is already on npm (a version number is never reused)"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$NEXT" | grep -q .; then
            echo "::error::tag v$NEXT already exists"; exit 1
          fi
          # a stable version needs a `v<V>-rc.*` tag on exactly HEAD (the rc's own release commit):
          # nothing may land between the last rc and stable
          if [[ "$NEXT" != *-* ]]; then
            RC_TAG=$(git tag -l "v$NEXT-rc.*" | sort -V | tail -1)
            if [[ -z "$RC_TAG" ]]; then
              echo "::error::stable $NEXT needs a v$NEXT-rc.* tag first"; exit 1
            fi
            if [[ "$(git rev-list -n1 "$RC_TAG")" != "$(git rev-parse HEAD)" ]]; then
              echo "::error::HEAD is not the commit of $RC_TAG — cut a new rc first"; exit 1
            fi
          fi
          # prerelease → its id as the dist-tag (0.2.0-rc.1 → rc); otherwise latest
          TAG=latest
          if [[ "$NEXT" == *-* ]]; then PRE=${NEXT#*-}; TAG=${PRE%%.*}; fi
          echo "$CURRENT → $NEXT (dist-tag $TAG)"
          { echo "version=$NEXT"; echo "dist_tag=$TAG"; } >> "$GITHUB_OUTPUT"

      - name: Set version (package.json, plugin manifest, SKILL.md pin)
        env:
          NEXT: ${{ steps.version.outputs.version }}
        run: npm version "$NEXT" --no-git-tag-version --allow-same-version # the `version` script builds and runs sync-version
      # installed copies follow the harness sources of this version
      - run: node cli/dist/reins.js update
      # the same gate as CI and the hooks
      - run: pnpm check
      - run: node cli/dist/reins.js check --drift
      - name: The CLI, package.json, plugin manifest and SKILL.md pin all say the version being published
        env:
          NEXT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          test "$(node cli/dist/reins.js --version)" = "$NEXT"
          test "$(node -p "require('./package.json').version")" = "$NEXT"
          test "$(node -p "require('./.claude-plugin/plugin.json').version")" = "$NEXT"
          node -e '
            const t = require("fs").readFileSync("skills/reins-setup/SKILL.md", "utf8");
            const pins = [...t.matchAll(/@bluenyang\/reins@(\d+\.\d+\.\d+(?:-[0-9A-Za-z.]+)?)/g)].map((m) => m[1]);
            if (pins.length === 0 || pins.some((v) => v !== process.env.NEXT)) {
              console.error("SKILL.md pins:", pins, "expected", process.env.NEXT); process.exit(1);
            }'

      - name: npm stage publish (approval needed before it is live)
        env:
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            npm publish --access public --tag "$DIST_TAG" --dry-run
          else
            npm stage publish --access public --tag "$DIST_TAG"
            {
              echo "### @bluenyang/reins v${{ steps.version.outputs.version }} is staged, not live"
              echo "Approve it with 2FA: npmjs.com → Staged Packages, or \`npm stage approve <stage-id>\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit version, tag, push
        if: ${{ !inputs.dry_run }}
        env:
          NEXT: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # explicit paths only: the version files and whatever `reins update` changed in the installed copies
          git add package.json .claude-plugin/plugin.json skills/reins-setup/SKILL.md
          git status --porcelain -- .agents .claude | sed -E 's/^.{3}//' | while IFS= read -r f; do git add -- "$f"; done
          git commit -m "release: v$NEXT (staged on npm, live after approval)" # the hooks run here too (C5)
          git tag "v$NEXT"
          for attempt in 1 2 3; do
            git push origin "HEAD:${GITHUB_REF_NAME}" && break
            [[ $attempt -eq 3 ]] && { echo "::error::push failed — npm has v$NEXT; push the version commit by hand"; exit 1; }
            git pull --rebase origin "${GITHUB_REF_NAME}"
          done
          git push origin "v$NEXT"
