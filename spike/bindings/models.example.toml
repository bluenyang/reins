# Model bindings — which agent and model runs each role.
#
# Lookup order (later wins):
#   1. this file's defaults, copied to ~/.config/reins/models.toml by `harness.py install`
#      when that file does not exist
#   2. ~/.config/reins/models.toml        (per user, all projects)
#   3. <project>/.ai/models.toml                 (per project, gitignored)
#
# `prompt` is the assembled role prompt; `{prompt_file}` is a file holding it.
# Headless flags change between CLI releases — check with `harness.py doctor` and each CLI's --help.

[agents.claude]
cmd = ["claude", "-p", "--model", "{model}", "{prompt}"]

[agents.codex]
cmd = ["codex", "exec", "--model", "{model}", "{prompt}"]

[agents.agy]            # Antigravity CLI (replaced Gemini CLI for personal accounts in 2026-06)
cmd = ["agy", "-p", "{prompt}", "-m", "{model}"]   # verify flags: agy --help

[agents.cursor]
cmd = ["cursor-agent", "-p", "--model", "{model}", "{prompt}"]

# --- roles ---------------------------------------------------------------
# agent: a key of [agents]; model: passed as {model}.
# Independence rule: reviewer and qa should not share a vendor with developer.

[roles.orchestrator]
agent = "claude"
model = "opus"

[roles.analyst]
agent = "claude"
model = "opus"

[roles.architect]
agent = "claude"
model = "opus"

[roles.design_review]
agent = "agy"
model = "gemini-3.1-pro"

[roles.developer]
agent = "claude"
model = "sonnet"

[roles.developer_sub]
agent = "claude"
model = "sonnet"

[roles.developer_trivial]
agent = "claude"
model = "haiku"

[roles.verifier]
agent = "claude"
model = "haiku"

[roles.reviewer]
agent = "codex"          # until a ChatGPT plan exists: agent = "cursor", a GPT model
model = "gpt-6.1-sol"

[roles.qa]
agent = "agy"
model = "gemini-3.1-pro"

[roles.qa_runner]
agent = "agy"
model = "gemini-3.6-flash"

[roles.triage]
agent = "claude"
model = "sonnet"

[roles.escalate]
agent = "claude"
model = "claude-fable-5-1"   # not for security review/exploit analysis — use opus or reviewer

[roles.writer]
agent = "claude"
model = "sonnet"
humanize = "im-not-ai"       # Claude skill applied to human-facing text only

[roles.release]
agent = "claude"
model = "haiku"
